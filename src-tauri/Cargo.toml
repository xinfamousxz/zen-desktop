[package]
name = "zen"
version = "0.1.6"
description = "Zen — the free Discord alternative. Chat, voice, and community, without the paywall."
authors = ["Z Industry"]
edition = "2021"
rust-version = "1.77.2"

# Desktop-only binary crate (Windows + macOS). The shared app logic lives
# in src/lib.rs (with a mobile entry point), so the same shell also builds
# for Android; main.rs is just the desktop wrapper that calls zen::run().
# Desktop-only plugins (updater, process) and the tray-icon feature are
# gated to desktop targets below — they have no mobile support.
[lib]
name = "zen"
path = "src/lib.rs"
# Android loads the app as a native .so via JNI, so the lib must also
# build as a cdylib (staticlib is for iOS). The desktop binary links the
# rlib, which is unchanged.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(desktop)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
