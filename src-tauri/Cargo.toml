[package]
name = "zen"
version = "0.1.0"
description = "Zen — the free Discord alternative. Chat, voice, and community, without the paywall."
authors = ["Z Industry"]
edition = "2021"
rust-version = "1.77.2"

# Desktop-only binary crate (Windows + macOS). No [lib] section: the app
# logic lives in src/main.rs. If Tauri Mobile is added later, split the
# app into src/lib.rs + src/main.rs (the standard Tauri template layout).
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
