name: Build Zen desktop installers

# The tauri-action uploads the built installers to the release, which needs
# write access to repo contents (otherwise the upload fails with
# "Resource not accessible by integration").
permissions:
  contents: write

# Builds the Windows (.exe/.msi) and macOS (.dmg) installers and uploads
# them to the GitHub release that triggered this workflow.
#
# How to cut a release:
#   1. Make sure the repo variable ZEN_BACKEND_URL is set for a Beta build
#      (the Vultr server URL, e.g. https://zen.example.com) — leave it
#      UNSET for a pre-load build (the app shows the countdown instead).
#      Repo Settings -> Secrets and variables -> Actions -> Variables.
#   2. Create a GitHub release (tag vX.Y.Z) — via the web UI or
#      `gh release create vX.Y.Z`. This workflow builds the installers on
#      Windows + macOS runners and attaches them to that release.
#      A pre-release works the same way for a test build.
#   3. The pre-load app's auto-updater picks the release up on next launch.
#
# Required secrets (repo Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the key password you chose)
# Without them the build fails: the updater needs a signed release.
# See desktop-app/README.md ("What is needed next") for the one-time setup.

on:
  release:
    types: [published]
  # Manual trigger for the Android debug APK — no release needed.
  # Actions tab -> Build Zen desktop installers -> Run workflow,
  # or: gh workflow run build.yml
  workflow_dispatch:

jobs:
  build:
    # The desktop installers are only built for a published release.
    # (workflow_dispatch exists for the Android job below.)
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          # macOS builds as a UNIVERSAL binary (Intel + Apple Silicon in one
          # .dmg) so a single download works on every Mac. The aarch64-only
          # DMG was reported as "damaged" on a Mac, and a universal build
          # removes the chip question entirely (Rosetta is not needed).
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Beta build: repo variable set by the maintainer once the server is
      # live. Pre-load build: leave the variable unset (empty backend URL).
      ZEN_BACKEND_URL: ${{ vars.ZEN_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets for universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Tauri CLI and generate platform icons
        # Generates icon.icns (macOS) and any missing sizes from icon.png.
        run: |
          npm install -g @tauri-apps/cli@2
          tauri icon src-tauri/icons/icon.png

      - name: Build installers and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ZEN_BACKEND_URL: ${{ env.ZEN_BACKEND_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Zen desktop app. Download it early — it unlocks for the Beta on November 20, 2026."
          releaseDraft: false
          prerelease: false
          # Keep the universal macOS binary as a single entry in the updater
          # JSON. With the default (false) the action splits it per-arch,
          # cannot find per-arch signatures, and skips uploading latest.json
          # entirely ("Signature not found for the updater JSON") — which
          # broke auto-updates in v0.1.0–v0.1.2.
          updaterJsonKeepUniversal: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

  # ---------------------------------------------------------------------------
  # Android debug APK (sideload). Runs only on manual dispatch — never on a
  # release, and it never touches the desktop installers or the updater.
  #
  # Why CI builds it: the local VM cannot run Gradle (its sandbox blocks
  # Java loopback TCP, which the Gradle daemon needs), so the APK is built
  # on a GitHub runner instead. The Android project (src-tauri/gen/android)
  # is gitignored, so this job runs `tauri android init --ci` first, then
  # pins compileSdk/targetSdk to 36 (API 37 is not in the public SDK repo
  # yet) and builds the debug APK. The APK is uploaded as a workflow
  # artifact — download it from the run's Artifacts section.
  # ---------------------------------------------------------------------------
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Pre-load build: repo variable unset (empty backend URL) means the
      # app shows the countdown until the server is live (Nov 20).
      ZEN_BACKEND_URL: ${{ vars.ZEN_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships an Android SDK
      # (/usr/local/lib/android/sdk) — the setup-android action is not
      # needed and its default `tools` package no longer exists in the
      # SDK repository, so it fails. Install only the packages we need.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/cmdline-tools/latest" ]; then CT="$SDK/cmdline-tools/latest/bin"; else CT="$(ls -d "$SDK"/cmdline-tools/*/ | sort -V | tail -n 1)bin"; fi
          export PATH="$CT:$PATH"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Init Android project
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        # The CLI is installed via npm, so the binary is `tauri`,
        # not `cargo tauri` (that needs the cargo-tauri crate).
        run: tauri android init --ci

      - name: Pin compileSdk/targetSdk to 36
        # The generated project may default to a different API level;
        # 36 is the newest platform in the public SDK repository.
        run: |
          sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/targetSdk = [0-9]*/targetSdk = 36/' src-tauri/gen/android/app/build.gradle.kts
          grep -E 'compileSdk|targetSdk' src-tauri/gen/android/app/build.gradle.kts

      - name: Link the Tauri CLI for the Gradle Rust plugin
        # The generated Gradle Rust plugin runs
        # `node tauri android android-studio-script` from src-tauri, and
        # Node resolves the bare `tauri` name to a file literally named
        # `tauri` in that directory. Symlink it to the globally
        # installed CLI (CI-only; nothing is committed).
        run: |
          ln -s "$(npm root -g)/@tauri-apps/cli/tauri.js" src-tauri/tauri
          (cd src-tauri && node tauri --version)

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: tauri android build --debug --apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
